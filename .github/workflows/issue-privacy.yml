name: issue-privacy

# Issue titles and bodies are public. If a new or edited issue contains secrets, account
# data, or personal data anywhere (title, or body, not only in the JSON record), replace the
# body with a redaction notice (and the title too when the title held it). Runs base-branch code only and never echoes the values.
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  scan:
    # No loop: edits made with GITHUB_TOKEN never start a new workflow run, the redaction
    # notice itself scans clean, and bot-made edits are skipped here as a second guard.
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Scan the issue title and the whole body
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - << 'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, ".")
          from tools.book_check import privacy_reasons
          title_reasons = privacy_reasons(os.environ.get("ISSUE_TITLE", ""))
          reasons = sorted(set(privacy_reasons(os.environ.get("ISSUE_BODY", "")) + title_reasons))
          pathlib.Path("/tmp/privacy.json").write_text(json.dumps(reasons))
          if title_reasons:
              pathlib.Path("/tmp/title-hit").write_text("1")
          PY

      - name: Redact when private data was found
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, pathlib
          reasons = json.loads(pathlib.Path("/tmp/privacy.json").read_text())
          if reasons:
              note = ("This issue was redacted by the automatic privacy filter because it looked like it held: "
                      + "; ".join(reasons) + ". Please file again without credentials or account data, "
                      "or write to gbtnsupport@gmail.com. A maintainer will also remove the original text from this issue's edit history.")
              pathlib.Path("/tmp/redacted.txt").write_text(note + "\n")
          PY
          if [ -f /tmp/redacted.txt ]; then
            if [ -f /tmp/title-hit ]; then
              gh issue edit "$ISSUE_NUMBER" --title "Redacted by the privacy filter"
            fi
            gh issue edit "$ISSUE_NUMBER" --body-file /tmp/redacted.txt
            gh issue comment "$ISSUE_NUMBER" --body-file /tmp/redacted.txt
            # GitHub keeps the original body in the issue's edit history. Flag it so the
            # maintainer can delete that revision (issue menu: edited > Delete revision).
            gh label create privacy-redacted --description "Body redacted; maintainer must delete the edit-history revision" --color D93F0B 2>/dev/null || true
            gh issue edit "$ISSUE_NUMBER" --add-label privacy-redacted
          fi
